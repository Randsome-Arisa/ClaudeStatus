name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux Build & Test ──
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2-dev libdbus-1-dev libnotify-dev libgtk-4-dev libayatana-appindicator3-dev libxdo-dev

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: claude-status-linux-x86_64
          path: |
            target/release/claude-status
            target/release/claude-status-send

  # ── Windows Build ──
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check --workspace

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: claude-status-windows-x86_64
          path: |
            target/release/claude-status.exe
            target/release/claude-status-send.exe
